name: Update data

# Asks GitHub to run twice an hour. GitHub sometimes drops scheduled runs when
# it is busy, so two chances an hour keeps updates roughly hourly. When nothing
# new happened, a run takes a minute or two and uploads one file.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Re-download every vote in this Congress"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # lets the last step keep the hourly schedule switched on

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install .

      - name: Fetch, build, and publish
        env:
          CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          OPENSTATES_DAILY_BUDGET: ${{ vars.OPENSTATES_DAILY_BUDGET }}
          OPENSTATES_PER_MINUTE: ${{ vars.OPENSTATES_PER_MINUTE }}
          OPENSTATES_BACKFILL_DAYS: ${{ vars.OPENSTATES_BACKFILL_DAYS }}
          FULL_REFRESH: ${{ inputs.full_refresh }}
        run: |
          if [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare R2 secrets are not set yet. Skipping this run. See README > Setup."
            exit 0
          fi
          ARGS="--store r2"
          if [ "$FULL_REFRESH" = "true" ]; then ARGS="$ARGS --full-refresh"; fi
          python -m votetracker run $ARGS

      - name: Keep the hourly schedule switched on
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" || true
