# Jurisdictions are data, not code.
#
# kind:        state | district | territory  (a starting hint only)
# house_seats: seats after the 2020 apportionment (voting seats for states,
#              1 non-voting seat for DC and the territories)
# fips:        Census state FIPS code (used to match Census Geocoder results)
#
# The pipeline treats any jurisdiction that has sitting U.S. senators in the
# official member data as a state automatically. If DC or Puerto Rico are
# admitted, their senators appear in the source data and the apps update
# with no code change. Update kind and house_seats here when convenient.
#
# Source for seats: U.S. Census Bureau, 2020 Census Apportionment Results.

